# Cấu hình tạm thời - CHỈ ĐỂ XÁC THỰC
server {
    listen 80;
    server_name novotel.cuongdev.tech www.novotel.cuongdev.tech;

    # Đây là phần cho Certbot xác thực
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng các request khác (tạm thời)
    location / {
        return 301 https://$host$request_uri;
    }
}