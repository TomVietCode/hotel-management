version: '3.8'

services: 
  # 1. Service for PHP-FPM (Laravel app)
  app:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: novotel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - novotel-network
  
  # 2.Service for web server (Nginx)
  nginx: 
    image: nginx:alpine
    container_name: hotel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on: 
      - app
    networks:
      - novotel-network

  certbot:
    image: certbot/certbot
    container_name: novotel-certbot
    volumes: 
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    command: ["--version"]

networks:
  novotel-network:
    driver: bridge

volume:
  certbot_certs:
  certbot_webroot:


