# File: .do/app.yaml
name: hotel-management
region: sgp

services:
- name: web
  github:
    repo: TomVietCode/hotel-management
    branch: main
    deploy_on_push: true
  
  build_command: |
    composer install --no-dev --optimize-autoloader --no-interaction
    npm ci
    npm run build
  
  run_command: "vendor/bin/heroku-php-apache2 public/"
  
  environment_slug: php
  instance_count: 1
  instance_size_slug: basic-xxs
  
  http_port: 8080
  
  routes:
  - path: /
  
  # ❌ KHÔNG ĐỂ PASSWORD Ở ĐÂY!
  # Thay vào đó, dùng ${VARIABLE_NAME} để reference từ environment variables
  envs:
  - key: APP_NAME
    value: "Novotel"
  - key: APP_ENV
    value: "production"
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: APP_DEBUG
    value: "false"
  - key: APP_URL
    value: "${APP_URL}"
  - key: DB_CONNECTION
    value: "mysql"
  - key: DB_HOST
    value: "${hotel-db.HOSTNAME}"
  - key: DB_PORT
    value: "${hotel-db.PORT}"
  - key: DB_DATABASE
    value: "${hotel-db.DATABASE}"
  - key: DB_USERNAME
    value: "${hotel-db.USERNAME}"
  - key: DB_PASSWORD
    value: "${hotel-db.PASSWORD}"
  - key: SESSION_DRIVER
    value: "database"
  - key: CACHE_STORE
    value: "database"

databases:
- name: hotel-db
  engine: MYSQL
  version: "8"
  production: false