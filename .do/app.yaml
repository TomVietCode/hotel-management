# File: .do/app.yaml
name: hotel-management
region: sgp

services:
- name: web
  github:
    repo: TomVietCode/hotel-management
    branch: main
    deploy_on_push: true
  
  build_command: |
    composer install --no-dev --optimize-autoloader --no-interaction
    npm ci
    npm run build
    php artisan storage:link
  
  run_command: "vendor/bin/heroku-php-apache2 -C apache_app.conf public/"
  
  environment_slug: php
  instance_count: 1
  instance_size_slug: basic-xxs
  
  http_port: 8080
  
  routes:
  - path: /
  
  envs:
  - key: APP_NAME
    value: "Novotel"
  - key: APP_ENV
    value: "production"
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: APP_DEBUG
    value: "false"
  - key: APP_URL
    value: "${APP_URL}"
  - key: DB_CONNECTION
    value: "mysql"
  - key: DB_HOST
    value: "mysql-ba70289-hanflorist-634a.l.aivencloud.com"
  - key: DB_PORT
    value: "22123"
  - key: DB_DATABASE
    value: "hotel-management-db"
  - key: DB_USERNAME
    value: "avnadmin"
  - key: DB_PASSWORD
    value: "AVNS_Tx3NiZ76Gyi-DbBIMT5"
  - key: SESSION_DRIVER
    value: "database"
  - key: CACHE_STORE
    value: "database"
  - key: QUEUE_CONNECTION
    value: "database"

databases:
- name: hotel-db
  engine: MYSQL
  version: "8"
  production: false