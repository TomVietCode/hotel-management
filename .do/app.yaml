name: hotel-management
services:
- name: web
  github:
    repo: TomVietCode/hotel-management
    branch: main
  build_command: |
    composer install --no-dev --optimize-autoloader
    npm install
    npm run build
    php artisan config:cache
    php artisan route:cache
    php artisan view:cache
  run_command: |
    php artisan migrate --force
    heroku-php-apache2 public/
  environment_slug: php
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: APP_KEY
    scope: RUN_TIME
    type: SECRET
databases:
- name: hotel-db
  engine: MYSQL
  version: "8"
  size: basic-xs